
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:meudb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#kafka
spring.kafka.bootstrap-servers=localhost:9092

app.dynamodb.table-name: ${DYNAMODB_TABLE:products}
app.dynamodb.region: ${AWS_REGION:us-east-1}
# Preencha para usar DynamoDB Local / LocalStack (ex.: http://localhost:4566)
app.dynamodb.endpoint: ${DYNAMODB_ENDPOINT:}
